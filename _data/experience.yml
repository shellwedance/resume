# Jobs
- company: 라인플러스
  position: 클라우드 엔지니어
  duration: Jul, 2021 &mdash; 현재
  summary: |
    <h3 style="font-size:1.5rem;color:coral">사내 클라우드의 AI 에이전트 개발 및 운영</h3>
    다양한 서비스와 기능들로 복잡도가 높은 사내 클라우드를 사용자가 쉽게 이용할 수 있도록 LangGraph 기반 AI 에이전트 서비스를 개발 및 운영했습니다.
    클라우드 공식 가이드 및 Q&A Jira 티켓을 기반으로 RAG 파이프라인을 구성하고, 사용법 및 트러블슈팅 관련 질문들을 답변할 수 있게 했습니다.
    또한, 클라우드 서비스들의 API를 Tool로 연동하고, 사용자 권한 내에서 API 호출을 지원하도록 액세스 토큰을 Human-In-The-Loop(HITL)로 전달하여 리소스 관련 질문들도 답변할 수 있도록 했습니다.
    그리고 답변 품질을 향상시키기 위해 QA와 협력하여 평가 프레임워크를 구축하였고, 결과적으로 실환경 릴리즈 후 답변률 97.1%, 사용자 답변 만족률 88.2%를 달성했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>가이드 문서 및 Jira 티켓 기반 RAG 구축 및 지식 기반 Search Tool 개발</li>
    <li>클라우드 서비스 연동을 위한 API Tool 개발 및 질문 대상 서비스의 Tool만 선택적으로 바인딩하여 토큰 효율성, 답변 품질 향상</li>
    <li>품질 평가를 위해 Promptfoo를 도입하여 프로바이더 및 Non-Streaming API 구현, Git Action을 연동하여 품질 테스트 자동화</li>
    <li>Athenz 기반 서비스 인증 설정 및 API Tool 권한 인가 필요 시 HITL을 통한 액세스 토큰 주입</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">AI 컨텍스트 레지스트리 개발 및 운영</h3>
    사내 문서, 소스 코드, 메트릭, 로그 등 흩어져있는 지식들을 바인더라는 단위로 모아서 AI 챗봇 혹은 MCP로 제공하는 컨텍스트 레지스트리 서비스를 개발 및 운영했습니다.
    예를 들면 개발자는 서비스의 소스 코드와 메트릭, 로그를 바인더에 등록하고 MCP로 Export하여 서비스 장애 분석, 운영 등의 업무를 AI Ops로 처리할 수 있습니다.
    각 데이터 소스의 연동 방법은 위키, 코드 등 정적인 지식과 메트릭, 로그 등 동적인 지식을 구분하여 개별적으로 설계했고,
    바인더의 공유 기능을 제공하기 위해 데이터 소스 별로 사용자 기반의 인증인가를 지원하도록 개발했습니다.
    결과적으로 챗봇 기준으로만 하루 800여건의 질문을 처리하며 성공적으로 운영중입니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>LangGraph ReAct Agent 기반 챗봇 기능 개발</li>
    <li>메트릭, 로그를 데이터 소스로 연동하기 위한 런타임 쿼리 Tool 개발 및 인가 구조 설계</li>
    <li>OIDC 로그인부터 사용자 요청 인가 처리까지 Ingress 인증 체인 구축</li>
    <li>연동하는 데이터의 개인정보, 기밀 등급 등 거버넌스 충족을 위한 보안 검수 진행</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">클라우드 로그 플랫폼 개발 및 운영</h3>
    사내 클라우드 사용자들의 어플리케이션 로그 및 서비스 로그를 저장, 관리하는 플랫폼 개발 및 운영했습니다.
    로그 파이프라인 설계부터 SDK, 파이프라인 컴포넌트 및 컨트롤러들을 자체 개발했고, 로그 저장소인 OpenSearch 클러스터 및 대시보드를 운영했습니다.
    처리량, 지연시간, 파이프라인 적체, OpenSearch 클러스터 상태를 기준으로 운영 지표와 단계별 알림 체계를 설계해 장애 징후와 용량 한계를 선제적으로 파악할 수 있게 했고,
    결과적으로 160K RPS의 로그 트래픽을 로그 손실 없이 허용 범위 지연시간 내에 처리하며 운영중입니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>로그 저장소 스케줄링, 사용량 및 트래픽 제한, 인증 등을 관리하기 위한 커스텀 컨트롤러 개발</li>
    <li>데이터 OpenSearch 클러스터 운영 및 노드 리소스 최적화 모듈 개발</li>
    <li>GitOps 기반 프로젝트 CI/CD 파이프라인을 구성하여 배포 및 테스트 자동화</li>
    <li>로그 처리량, 지연시간, 파이프라인 적체, OpenSearch 상태 기반 단계별 알림 및 Grafana 대시보드 구성</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">클라우드 스토리지 서비스 개발 및 운영</h3>
    국내외 페타바이트 규모의 데이터를 수용하기 위해 수십 개의 Ceph 클러스터를 운영하며,
    사내 클라우드용 오브젝트 스토리지의 성능 저하 원인을 분석하고 개선하기 위한 기능을 개발 및 배포했습니다.
    또한, 사내 스토리지의 구조에 맞춰 자체 CSI 플러그인을 개발하여 Managed K8s Service에 배포하고 볼륨을 제공했습니다.
    그리고 NVMe-oF 기반 고성능 스토리지 서비스를 개발 및 운영했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Ansible과 Ceph CLI을 이용하여 40여개의 Ceph 클러스터 유지보수 및 장애 대응</li>
    <li>RGW Versioning으로 인한 OSD RocksDB 성능 저하 원인 분석 및 개선 기능 개발</li>
    <li>Cinder C-plane의 스토리지 구조를 고려하여 고가용성을 지원하는 자체 CSI 플러그인 개발</li>
    <li>NVMe-oF 기반 고성능 스토리지 설계 및 클러스터 배포, 전용 CSI 플러그인 개발</li>
    </ul>
    
    <h3 style="font-size:1.5rem;color:coral">서버리스 서비스 개발</h3>
    4개 언어의 빌드와 이벤트 트리거 및 Zero-Scale을 지원하는 사내 프라이빗 클라우드의 Function 컴퓨팅 서비스를 개발했습니다.
    확장성을 고려하여 C-plane, D-plane 클러스터를 분리하는 구조 및 각 클러스터에서 사용할 CR과 컨트롤러의 설계 및 구현했습니다.
    또한 CI/CD를 담당하여 환경별 배포 및 통합 테스트를 자동화했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>확장성을 위해 런타임, 빌드, 트리거 등 Function의 추상화된 정보를 관리하는 C-plane과 Knative, Istio를 배포하는 D-plane을 분리하는 구조 설계</li>
    <li>Knative, Istio 연동 및 클러스터의 리소스 사용량을 관리하는 D-plane 컨트롤러 구현</li>
    <li>환경별 배포 정책 수립 및 ArgoCD와 GitOps를 활용화여 배포 자동화</li>
    </ul>

