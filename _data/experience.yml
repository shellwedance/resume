# Jobs
- company: 라인플러스
  position: 클라우드 엔지니어
  duration: Jul, 2021 &mdash; 현재
  summary: |
    <h3 style="font-size:1.5rem;color:coral">사내 클라우드 시스템의 AI 에이전트 개발 및 운영</h3>
    다양한 서비스와 기능들로 복잡도가 높은 사내 클라우드를 사용자가 쉽게 이용할 수 있도록 LangGraph 기반 AI 에이전트 서비스를 개발 및 운영했습니다.
    사내 클라우드의 공식 가이드 문서 및 관련 Jira 티켓을 학습시켜서 사용법 및 트러블슈팅 관련 질문들을 답변할 수 있게 했습니다.
    또한, 클라우드 서비스별 API를 Tool로 연동하여 사용자 권한 내에서 리소스 관련 질문을 답변할 수 있게 했습니다.
    그리고 답변 품질을 향상시키기 위해 QA와 협력하여 평가 프레임워크를 구축하였고, 결과적으로 실환경 릴리즈 후 1400건의 쿼리 중 88.2%가 서비스 품질에 만족한다는 서베이 성과를 거두었습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Vector DB로 Milvus, Trace 시스템으로 Langfuse PoC 후 환경별 스펙 산정하여 배포 및 운영</li>
    <li>트러블슈팅 질문 답변을 위한 Jira 티켓 Search Tool의 RAG 파이프라인 구축 및 개인정보 필터링 기능 및 임베딩 스크립트 구현</li>
    <li>Athenz 기반 사용자 권한 정책과 검증 프록시 설정, ACL 관리, Observability 및 알람을 포함한 DevOps 수행</li>
    <li>평가 프레임워크를 위한 Promptfoo 도입, 자체 프로바이더 구현 및 Git 워크플로우 연동</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">클라우드 로그 플랫폼 개발 및 운영</h3>
    사내 프라이빗 클라우드 사용자의 어플리케이션 로그와 클라우드 서비스의 로그를 저장, 관리하는 플랫폼을 개발 및 운영했습니다.
    SDK부터 로그 파이프라인에 필요한 컴포넌트 및 컨트롤러, 로그 저장소인 OpenSearch 클러스터 및 대시보드를 개발, 배포 및 운영했습니다.
    시행 착오를 거쳐 필수 시스템 메트릭들을 모니터링 및 알람으로 설정하여 문제 상황 발생 전에 우선적으로 대응할 수 있게 구성했고,
    결과적으로 160K RPS의 로그 트래픽을 로그 손실 없이 허용 범위 지연시간 내에 처리했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>로그 파이프라인 설계 참여 및 Ingest, Store, Exporter 등의 컴포넌트와 커스텀 컨트롤러 구현</li>
    <li>로그 용도별 특성을 고려하여 OpenSearch 클러스터 관리 및 리소스 최적화 모듈 개발</li>
    <li>GitOps 기반 프로젝트 CI/CD 파이프라인을 구성하여 배포 및 테스트 자동화</li>
    <li>장애 예방을 위한 시스템 메트릭 기반 단계적 알림 및 모니터링 Grafana 대시보드 구성</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">클라우드 스토리지 서비스 개발 및 운영</h3>
    국내외 페타바이트 규모의 데이터를 수용하기 위해 수십 개의 Ceph 클러스터를 IaC로 관리했습니다.
    그리고 RGW의 선택적 versioning과 같이 서비스에 필요한 Ceph의 커스텀 기능 구현에 참여했습니다.
    또한, 스토리지 종류별로 고가용성을 지원하는 CSI 플러그인을 개발하여 K8s 서비스 프로바이더에게 제공했습니다.
    그리고 자사 클라우드 전용 이미지 레지스트리 서비스의 초기 설계 및 배포와 자체 Observability 구축에 기여했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>자사 블록 및 고성능 스토리지를 K8s에 제공하기 위한 Fault-Tolerant CSI 플러그인 개발</li>
    <li>Ansible을 이용한 3-40개의 Ceph 클러스터 유지보수 및 Ceph 커스텀 기능 구현</li>
    <li>이미지 레지스트리 아키텍처 설계 참여 및 K8s에 Harbor 클러스터 및 자체 Alertmanager 구축</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">서버리스 서비스 개발</h3>
    4개 언어의 빌드와 이벤트 트리거 및 Zero-Scale을 지원하는 사내 프라이빗 클라우드의 Function 컴퓨팅 서비스를 개발했습니다.
    확장성을 고려하여 C-plane, D-plane 클러스터를 분리하는 구조 및 각 클러스터에서 사용할 CR과 컨트롤러의 설계 및 구현에 참여했습니다.
    또한 CI/CD를 담당하여 환경별 배포 및 통합 테스트를 자동화했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>확장성을 위해 런타임, 빌드, 트리거 등 Function의 추상화된 정보를 관리하는 C-plane과 Knative, Istio를 배포하는 D-plane을 분리하는 구조 설계 참여</li>
    <li>Knative, Istio 연동 및 클러스터의 리소스 사용량을 관리하는 D-plane 컨트롤러 구현</li>
    <li>환경별 배포 정책 수립 및 ArgoCD와 GitOps를 활용화여 배포 자동화</li>
    </ul>

- company: 티맥스 클라우드
  position: 스토리지 연구원
  duration: Feb, 2019 &mdash; Jul, 2021
  summary: |
    
    <h3 style="font-size:1.5rem;color:coral">K8s 스토리지 솔루션 개발 및 운영</h3>
    On-premise 컨테이너 클라우드의 스토리지를 Rook-Ceph로 구축하여 Ceph 볼륨을 제공하는 스토리지 솔루션을 개발 및 운영했습니다.
    이 과정에서 Rook-Ceph 설치 및 관리 작업 간편화를 위해 CLI 툴을 개발하였고, 운영의 고도화를 위해 Ceph의 컴포넌트별 작동 방식을 코드 레벨로 연구했습니다.
    또한, 본 솔루션을 이용하는 노드 100대 규모의 자사 프라이빗 클라우드 및 고객사들의 다양한 트러블슈팅 및 기술지원을 수행했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Rook-Ceph을 이용한 스토리지 구조 설계 및 CLI 툴, E2E Test 개발 참여</li>
    <li>Mon Paxos, OSD BlueStore 등 Ceph 컴포넌트 작동구조 및 성능 튜닝 방안을 연구하여 고객 기술세미나 수행</li>
    <li>고객사 운영 중 발생하는 이슈 트러블슈팅 및 기술지원</li>
    </ul>
    
    <h3 style="font-size:1.5rem;color:coral">K8s 외부 스토리지 관리 오퍼레이터 개발</h3>
    K8s 및 oVirt의 멀티 클러스터를 관리하는 매니저 K8s의 외부 스토리지 컨트롤러를 개발에 참여했습니다.
    그 중 Cephadm을 이용한 클러스터 설치, Ceph 볼륨 제공 등 Ceph 프로비저닝 관련 컴포넌트를 담당하여 개발했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>프로젝트 클래스 구조, 테스트 단위, Mocking 범위 등 프로젝트 설계 참여</li>
    <li>Git Action을 이용한 CI 파이프라인 구축 및 프로젝트 개발 가이드라인 수립</li>
    <li>Cephadm 기반 Ceph 설치, 볼륨 생성 기능 개발 및 Unit/E2E Test 작성</li>
    </ul>
    
    <h3 style="font-size:1.5rem;color:coral">오브젝트 스토리지 서버 개발</h3>
    자사 C++ 클라우드 협업툴 제품을 활용하여 TCP 기반의 자체 오브젝트 스토리지 서버를 개발했습니다.
    협업툴 제품의 TCP 채널을 통해 오브젝트 저장 서비스를 제공하며, 전송받은 오브젝트를 벡엔드 파일 스토리지에 저장합니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em">
    <li>Boost Asio를 이용한 TCP 이벤트 관리 프레임워크 개발</li>
    <li>JSON 기반 오브젝트 API 설계 및 서비스 핸들러 개발</li>
    </ul>
    
    <br>

# Lab
- company: 데이터중심 컴퓨팅 및 AI 시스템 연구실(DISCOS)
  position: 연구원
  duration:  Mar, 2017 &mdash; Feb, 2019
  summary: |
    <h3 style="font-size:1.5rem;color:coral">검색 가능한 통합 파일시스템 개발</h3>
    연구 기관 간 협업을 지원하기 위해 각 기관의 파일시스템을 통합하며 데이터 기반 검색 기능을 제공하는 상위 레이어 파일시스템을 개발했습니다.
    POSIX 기반 파일시스템들의 네임스페이스를 유저 레벨에서 통합하였고, 각 기관에 DB shard를 분산하여 검색 기능을 제공했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>FUSE를 이용한 통합 네임스페이스 파일시스템 개발</li>
    <li>Protobuf, gRPC를 이용하여 모듈 간 통신 프로토콜 개발</li>
    <li>SQLite 기반 DB shard를 통한 데이터 인덱싱 및 검색 기능 개발</li>
    <li>제 2저자로 Future Generation Computer Systems(IF 5.678) 저널에 논문 게재</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">힙 메모리 변수 프로파일러 개발</h3>
    힙 영역에 할당된 변수를 대상으로 접근 횟수, 수명 등 접근 패턴을 분석하는 프로파일링 툴을 개발했습니다.
    프로파일링한 접근 패턴을 이용하면 여러 종류의 메모리에 해당 변수가 배치될 때 소비하는 전력량을 계산할 수 있습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Intel Pin Tool 기반 Instrumentation을 통한 프로파일러 개발</li>
    <li>프로파일러를 응용하여 DRAM 및 STTRAM에서의 변수 에너지 소비량 계산 및 배치 방법 연구</li>
    <li>제 1저자로 IEEE Access(IF 3.745) 저널에 논문 게재</li>
    </ul>
