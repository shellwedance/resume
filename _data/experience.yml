# Lab
- company: 데이터중심 컴퓨팅 및 AI 시스템 연구실(DISCOS)
  position: 연구원
  duration:  Mar, 2017 &mdash; Feb, 2019
  summary: |
    <h3 style="font-size:1.5rem;color:coral">이기종 메모리 시스템에서의 힙 메모리 변수 배치 기법 연구</h3>
    힙 영역에 할당된 변수를 대상으로 접근 횟수, 수명 등 접근 패턴을 분석하는 프로파일링 툴을 개발했습니다.
    프로파일링한 접근 패턴을 이용하면 여러 종류의 메모리에 해당 변수가 배치될 때 소비하는 전력량을 계산할 수 있습니다.
    이를 기반으로 어플리케이션별 에너지 소비량과 성능 간 조율 가능한 힙 메모리 오브젝트 배치 기법을 연구했고, 해당 연구는 IF 3.745인 SCI 저널 IEEE Access에 게재됐습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Intel Pin Tool 기반 Instrumentation을 통한 프로파일러 개발</li>
    <li>프로파일러를 응용하여 DRAM 및 STTRAM에서의 힙 메모리 오브젝트 에너지 소비량 계산</li>
    <li>ILP 알고리즘을 이용하여 기준 에너지 소비량을 만족시키며 성능을 최적화하는 오브젝트 배치 방법 연구</li>
    <li>논문 작성 및 제1저자 등재</li>
    </ul>
    
    <h3 style="font-size:1.5rem;color:coral">검색 가능한 과학용 통합 파일시스템 연구</h3>
    연구 기관 간 협업을 지원하기 위해 각 기관의 파일시스템을 통합하며 데이터 기반 검색 기능을 제공하는 상위 레이어 파일시스템을 개발했습니다.
    POSIX 기반 파일시스템들의 네임스페이스를 유저 레벨에서 통합하였고, 각 기관에 DB shard를 분산하여 검색 기능을 제공했습니다.
    해당 연구는 IF 5.678인 SCI 저널 Future Generation Computer Systems에 게재됐습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>FUSE를 이용한 통합 네임스페이스 파일시스템 개발</li>
    <li>Protobuf, gRPC를 이용하여 모듈 간 통신 프로토콜 개발</li>
    <li>SQLite 기반 DB shard를 통한 데이터 인덱싱 및 검색 기능 개발</li>
    <li>논문 작성 참여 및 제2저자 등재</li>
    </ul>
