# Jobs
# VP of Global Communications
- company: 라인플러스
  position: 클라우드 엔지니어
  duration: Jul, 2021 &mdash; 현재
  summary:
    <h3 style="font-size:1.5rem;color:coral">클라우드 로그 플랫폼 개발 및 운영</h3>
    사내 프라이빗 클라우드 사용자의 어플리케이션 로그와 클라우드 서비스 자체의 로그를 저장, 관리하는 플랫폼을 개발 및 운영하고 있습니다.
    로그 파이프라인을 구성하여 트래픽 160K RPS까지 딜레이 없이 수용하고 있으며, 로그 기반의 메트릭을 추출하여 서비스하고 있습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>로그 파이프라인 설계 및 이를 구성하는 다양한 컴포넌트의 기능 구현</li>
    <li>파이프라인 컴포넌트 및 시스템 모니터링을 위한 텔레메트리 에이전트의 CI/CD</li>
    <li>높은 트래픽에서도 딜레이 없이 서비스를 제공하기 위한 시스템 성능 튜닝</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">클라우드 스토리지 인프라 서비스 개발 및 운영</h3>
    사내 프라이빗 클라우드의 스토리지 인프라 서비스를 개발 및 운영했습니다.
    국내 뿐만 아니라 일본, 대만, 태국 등에서 들어오는 페타바이트 규모의 데이터를 수용하기 위해 수십 개의 클러스터를 관리했습니다.
    또한, K8s에 스토리지를 제공하기 위한 인터페이스를 개발했으며, 프라이빗 클라우드 전용 이미지 레지스트리 서비스를 개발 및 운영했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>K8s에 스토리지 서비스를 제공하기 위한 자체 CSI 개발</li>
    <li>NVMe 기반 고성능 Ceph 블록스토리지 설계 및 컴포넌트 개발</li>
    <li>Harbor 클러스터를 K8s에서 운영하도록 구조 설계 및 배포</li>
    </ul>

- company: 티맥스 클라우드
  position: 스토리지 연구원
  duration: Feb, 2019 &mdash; Jul, 2021
  summary: 
  #<h3>K8s 클러스터 외부 Ceph를 관리하는 operator 개발 (진행중) <a href="https://www.github.com/tmax-cloud/hypersds-provisioner">(url)</a></h3>

    <h3 style="font-size:1.5rem;color:coral">K8s 클러스터 외부 스토리지를 관리하는 오퍼레이터 개발</h3>
    다수의 외부 K8s 및 oVirt 클러스터를 관리하는 매니저 K8s의 외부 스토리지 컨트롤러를 개발했습니다.
    그 중 Ceph 클러스터 설치, Ceph 볼륨 제공 등 Ceph 프로비저닝 관련 컴포넌트를 담당하여 개발했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>프로젝트 클래스 구조, 테스트 단위, mocking 범위 등 프로젝트 설계 참여</li>
    <li>CI/CD 파이프라인 구축, 코드 리뷰 등 프로젝트 운영</li>
    <li>Cephadm 기반 Ceph 설치 기능 개발, unit/e2e test 작성</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">K8s 스토리지 솔루션 개발 및 운영</h3>
    K8s에 Rook-Ceph를 구성하여 Ceph 볼륨을 제공하는 스토리지 솔루션을 개발 및 운영했습니다.
    Rook-Ceph 설치 등 관리 작업 간편화를 위해 CLI 툴을 개발하였고, 운영의 고도화를 위해 Ceph를 연구했습니다.
    본 솔루션은 노드 100대 규모의 자사 프라이빗 클라우드를 비롯한 여러 고객사에서 안정적으로 운영했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Rook-Ceph를 이용하는 구조 설계</li>
    <li>Cobra, Ginkgo를 이용하여 CLI 툴 및 e2e test 개발</li>
    <li>고객사 운영 중 발생하는 이슈 트러블슈팅</li>
    <li>Mon Paxos, OSD BlueStore 등 Ceph 데몬 작동구조 및 성능 튜닝 연구</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">오브젝트 스토리지 서버 개발</h3>
    자사 클라우드 협업툴 제품의 오브젝트 스토리지 서버를 개발했습니다.
    TCP 채널을 통해 오브젝트 저장 서비스를 제공하며, 전송받은 오브젝트를 벡엔드 파일 스토리지에 저장합니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em">
    <li>Boost Asio를 이용한 TCP 이벤트 관리 프레임워크 개발</li>
    <li>JSON 기반 오브젝트 API 설계 및 서비스 핸들러 개발</li>
    </ul>
    <br>

# Lab
- company: 차세대 시스템 소프트웨어 연구실(LASS)
  position: 연구원
  duration:  Mar, 2017 &mdash; Feb, 2019
  summary:
    <h3 style="font-size:1.5rem;color:coral">검색 가능한 통합 파일시스템 개발</h3>
    연구 기관 간 협업을 지원하기 위해 각 기관의 파일시스템을 통합하며 데이터 기반 검색 기능을 제공하는 상위 레이어 파일시스템을 개발했습니다.
    POSIX 기반 파일시스템들의 네임스페이스를 유저 레벨에서 통합하였고, 각 기관에 DB shard를 분산하여 검색 기능을 제공했습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>FUSE를 이용한 통합 네임스페이스 파일시스템 개발</li>
    <li>Protobuf, gRPC를 이용하여 모듈 간 통신 프로토콜 개발</li>
    <li>SQLite 기반 DB shard를 통한 데이터 인덱싱 및 검색 기능 개발</li>
    <li>제 2저자로 Future Generation Computer Systems(IF 5.678) 저널에 논문 게재</li>
    </ul>

    <h3 style="font-size:1.5rem;color:coral">힙 메모리 변수 프로파일러 개발</h3>
    힙 영역에 할당된 변수를 대상으로 접근 횟수, 수명 등 접근 패턴을 분석하는 프로파일링 툴을 개발했습니다.
    프로파일링한 접근 패턴을 이용하면 여러 종류의 메모리에 해당 변수가 배치될 때 소비하는 전력량을 계산할 수 있습니다.

    <h4 style="font-size:1.3rem;margin-block-end:0.5em">What I did</h4>
    <ul class="resume-item-list" style="margin-block-start:0.5em;margin-block-end:2em">
    <li>Pin 기반 instrumentation을 통한 프로파일러 개발</li>
    <li>프로파일러를 응용하여 DRAM 및 STTRAM에서의 변수 에너지 소비량 계산 및 배치 방법 연구</li>
    <li>제 1저자로 IEEE Access(IF 3.745) 저널에 논문 게재</li>
    </ul>
