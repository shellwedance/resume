# Recognitions
- award: Certified Kubernetes Administrator(<b>CKA</b>)
  organization: CNCF & Linux Foundation
  year: Sep, 2020
  summary: 업무 효율성을 증진하기 위해 CKA 자격증을 취득했습니다.

- award: Optimizing Heap Memory Object Placement in the Hybrid Memory System With Energy Constraints
  organization: IEEE Access (IF 3.4)
  year: Jul, 2020
  summary: 하이브리드 메모리 시스템에서 힙메모리 오브젝트를 에너지 제약을 지키면서 최적의 성능을 내도록 배치하는 기법을 연구하여 IF 3.4의 국제 SCI 저널에 1저자로 논문을 게재했습니다.

- award: SCISPACE - A Scientific Collaboration Workspace for GeoDistributed HPC Data Centers
  organization: Future Generation Computer Systems (FGCS) (IF 5.6)
  year: Jun, 2019
  summary: 검색 가능한 과학 협업용 공유 파일 시스템을 개발하고 테스트하여 IF 5.6 국제 SCI 저널에 2저자로 논문을 게재했습니다.

- award: 우수발표논문상
  organization: 한국정보과학회
  year: Feb, 2019
  summary: 한국소프트웨어종합학술대회(KSC 2018) 컴퓨터시스템 분야 발표 세션에서 높은 점수를 받아 우수발표논문상을 수상하였습니다.

- award: NUMA-Aware Thread Scheduling for Big Data Transfers over Terabits Network Infrastructure
  organization: Scientific Programming (IF 1.3)
  year: Mar, 2018
  summary: 고성능 병렬 파일시스템 간의 데이터 전송 방식을 NUMA 구조를 고려하여 최적화하는 방법을 연구하여 IF 1.3의 국제 SCIE 저널에 1저자로 논문을 게재했습니다.
