# Recognitions
- award: Certified Kubernetes Administrator(<b>CKA</b>)
  organization: CNCF & Linux Foundation
  year: Sep, 2020
  summary: 업무 효율성을 증진하기 위해 CKA 자격증을 취득했습니다.

- award: (IF 3.4) SCI 논문 1저자 게재
  organization: IEEE Access
  year: Jul, 2020
  summary: 하이브리드 메모리 시스템에서 힙메모리 오브젝트 배치 기법을 연구하여 IF 3.4의 국제 SCI 저널에 1저자로 논문을 게재했습니다. (<a href="https://ieeexplore.ieee.org/document/9141271">link</a>)

- award: (IF 5.6) SCI 논문 2저자 게재
  organization: Future Generation Computer Systems (FGCS)
  year: Jun, 2019
  summary: 검색 가능한 과학 협업용 공유 파일 시스템을 개발 및 테스트하여 IF 5.6의 국제 SCI 저널에 2저자로 논문을 게재했습니다. (<a href="https://www.sciencedirect.com/science/article/abs/pii/S0167739X18326025">link</a>)

- award: 우수발표논문상
  organization: 한국정보과학회
  year: Feb, 2019
  summary: 한국소프트웨어종합학술대회(KSC 2018) 컴퓨터시스템 분야 발표 세션에서 높은 점수를 받아 우수발표논문상을 수상하였습니다.

- award: (IF 1.3) SCIE 논문 1저자 게재
  organization: Scientific Programming
  year: Mar, 2018
  summary: 고성능 병렬 파일시스템 간의 데이터 전송 방법을 연구하여 IF 1.3의 국제 SCIE 저널에 1저자로 논문을 게재했습니다. (<a href="https://onlinelibrary.wiley.com/doi/10.1155/2018/4120561">link</a>)
